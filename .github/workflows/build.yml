name: Compilar HeadESP Fabric 1.21.4
on:
  push:
    branches: [minecraft-1.21.4]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compilar
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HeadESP-1.21.4-jar
          path: build/libs/*.jar
          if-no-files-found: error

# Rebuild trigger for the corrected 1.21.4 shader API.
